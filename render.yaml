services:
  - type: web
    name: campuscare
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString
      - key: PGSSLMODE
        value: require

databases:
  - name: campuscare-db
    plan: free
